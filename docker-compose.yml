# Local development services. Ports are bound to this machine only.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: triagebot
      POSTGRES_PASSWORD: triagebot
      POSTGRES_DB: triagebot
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triagebot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
